<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5: JavaScript Buttons</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Assignment 5</h1>
    </header>

    <main class="card-container">

        <section class="card">
            <h2>Sunny Times</h2>
            <p id="sunny-times-text">Click the button...</p>
            <button id="sunny-times-btn">Show Sunny Times</button>
        </section>

        <section class="card">
            <h2>Select a Color</h2>
            <p id="color-box">This box will change color.</p>
            <input type="color" id="color-picker">
            <button id="color-change-btn">Change Color</button>
        </section>

        <section class="card">
            <h2>Image Change</h2>
            <img id="toggle-image" src="images/clouds.png" alt="A sky with clouds" title="Cloudy Sky">
            <button id="image-change-btn">Change Image</button>
        </section>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
