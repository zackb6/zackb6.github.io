<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleeveNotes Project Wireframes</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            max-width: 1000px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #cccccc;
        }
        h1, h2 { 
            text-align: center; 
            color: #333;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 10px;
        }
        img { 
            width: 100%;
            border: 1px solid #dddddd;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SleeveNotes: Project Wireframes</h1>

        <h2>My Collection (Dashboard)</h2>
        <img src="images/dashboard.png" alt="Wireframe of the main collection dashboard">

        <h2>Record Detail Page</h2>
        <img src="images/detail-page.png" alt="Wireframe of the record detail page">

        <h2>Add New Record Page</h2>
        <img src="images/add-new-page.png" alt="Wireframe of the 'add new record' form">
        
        <h2>Wishlist Page</h2>
        <img src="images/wishlist-page.png" alt="Wireframe of the wishlist page">

        <h2>Profile / Statistics Page</h2>
        <img src="images/profile-page.png" alt="Wireframe of the profile and statistics page">

    </div>
</body>
</html>
