<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collection - SleeveNotes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">SleeveNotes</div>
        <button id="menu-toggle">☰</button>
        <nav id="main-nav">
            <a href="index.html">My Collection</a>
            <a href="add-new.html">Add New</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="container">
        <div class="action-bar">
            <input type="text" placeholder="Search your collection...">
            <a href="add-new.html" class="button">Add New Record</a>
        </div>
        
        <h1>My Collection</h1>

        <div class="card-grid">

            <div class="record-card">
                <a href="detail.html"><img src="images/darkside.jpeg" alt="Album Art for The Dark Side of the Moon"></a>
                <h3>The Dark Side of the Moon</h3>
                <p>Pink Floyd</p>
            </div>
            
            <div class="record-card">
                <a href="detail.html"><img src="images/abbey road.jpg" alt="Album Art for Abbey Road"></a>
                <h3>Abbey Road</h3>
                <p>The Beatles</p>
            </div>

            <div class="record-card">
                <a href="detail.html"><img src="images/rumours.jpeg" alt="Album Art for Rumours"></a>
                <h3>Rumours</h3>
                <p>Fleetwood Mac</p>
            </div>

            <div class="record-card">
                <a href="detail.html"><img src="images/led zep 4.jpg" alt="Album Art for Led Zeppelin IV"></a>
                <h3>Led Zeppelin IV</h3>
                <p>Led Zeppelin</p>
            </div>

            <div class="record-card">
                <a href="detail.html"><img src="images/thriller.jpeg" alt="Album Art for Thriller"></a>
                <h3>Thriller</h3>
                <p>Michael Jackson</p>
            </div>

            <div class="record-card">
                <a href="detail.html"><img src="images/tpab.jpeg" alt="Album Art for To Pimp a Butterfly"></a>
                <h3>To Pimp a Butterfly</h3>
                <p>Kendrick Lamar</p>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2025 SleeveNotes</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
