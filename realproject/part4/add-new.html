<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Record - SleeveNotes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">SleeveNotes</div>
        <button id="menu-toggle">☰</button>
        <nav id="main-nav">
            <a href="index.html">My Collection</a>
            <a href="add-new.html">Add New</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="container">
        <h1>Add New Record</h1>
        <form>
            <div class="form-group">
                <label for="album-title">Album Title</label>
                <input type="text" id="album-title" placeholder="e.g., Abbey Road">
            </div>
            <div class="form-group">
                <label for="artist">Artist</label>
                <input type="text" id="artist" placeholder="e.g., The Beatles">
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <input type="text" id="year" placeholder="e.g., 1969">
            </div>
            <button type="submit" class="button">Save Record</button>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2025 SleeveNotes</p>
    </footer>
    <script src="js/main.js"></script>  
</body>
</html>
