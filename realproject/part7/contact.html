<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SleeveNotes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">SleeveNotes</div>
        <button id="menu-toggle">☰</button>
        <nav id="main-nav">
            <a href="index.html">My Collection</a><a href="add-new.html">Add New</a><a href="wishlist.html">Wishlist</a><a href="profile.html">Profile</a><a href="about.html">About</a><a href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="container">
        <h1>Contact Us</h1>
        <div class="form-container">
            <p>Have questions? Fill out the form below.</p>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="button">Send Message</button>
                <div id="form-status" class="form-status"></div>
            </form>
        </div>
    </main>
    <footer><p>&copy; 2025 SleeveNotes</p></footer>
    <script src="js/app.js"></script>
</body>
</html>
