<main class="container">
    <h1>My Wishlist</h1>
    <div class="action-bar">
        <input type="text" placeholder="Add a new album to your wishlist...">
        <a href="#" class="button">Add</a>
    </div>
    
    <div class="wishlist-container">
        <div class="wishlist-item">
            <img src="images/placeholder-album-1.jpg" alt="Album Art">
            <div class="wishlist-info">
                <h3>Rumours</h3>
                <p>Fleetwood Mac</p>
            </div>
            <a href="#" class="button-remove">Remove</a>
        </div>
        <div class="wishlist-item">
            <img src="images/placeholder-album-2.jpg" alt="Album Art">
            <div class="wishlist-info">
                <h3>To Pimp a Butterfly</h3>
                <p>Kendrick Lamar</p>
            </div>
            <a href="#" class="button-remove">Remove</a>
        </div>
        <div class="wishlist-item">
            <img src="images/placeholder-album-3.jpg" alt="Album Art">
            <div class="wishlist-info">
                <h3>Led Zeppelin IV</h3>
                <p>Led Zeppelin</p>
            </div>
            <a href="#" class="button-remove">Remove</a>
        </div>
    </div>
</main>
